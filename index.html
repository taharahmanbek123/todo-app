<!DOCTYPE html>
<html>
<head>
  <title>Notes App</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      margin: 0;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 380px;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      text-align: center;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #4a6cf7;
      color: white;
      cursor: pointer;
    }

    .note {
      background: #f7f7f7;
      padding: 10px;
      border-radius: 10px;
      margin-top: 10px;
    }

    .tag {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 6px;
      color: white;
      margin-left: 5px;
    }

    .work { background: #4a6cf7; }
    .study { background: green; }
    .personal { background: crimson; }

    .actions {
      margin-top: 8px;
    }

    .actions span {
      cursor: pointer;
      margin-right: 10px;
      font-size: 14px;
    }

    .delete { color: red; }
    .edit { color: blue; }

    .search {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Notes App</h1>

    <input type="text" id="noteInput" placeholder="Write note">

    <select id="category">
      <option value="work">Work</option>
      <option value="study">Study</option>
      <option value="personal">Personal</option>
    </select>

    <button onclick="addNote()">Add Note</button>

    <input class="search" type="text" id="search" placeholder="Search notes..." oninput="renderNotes()">

    <div id="notesList"></div>
  </div>

  <script>
    let notes = JSON.parse(localStorage.getItem("notes")) || [];

    function save() {
      localStorage.setItem("notes", JSON.stringify(notes));
    }

    function addNote() {
      let text = document.getElementById("noteInput").value;
      let cat = document.getElementById("category").value;

      if (text === "") return;

      notes.push({
        text: text,
        category: cat
      });

      document.getElementById("noteInput").value = "";

      save();
      renderNotes();
    }

    function deleteNote(i) {
      notes.splice(i, 1);
      save();
      renderNotes();
    }

    function editNote(i) {
      let newText = prompt("Edit note:", notes[i].text);
      if (newText) {
        notes[i].text = newText;
        save();
        renderNotes();
      }
    }

    function renderNotes() {
      let list = document.getElementById("notesList");
      let search = document.getElementById("search").value.toLowerCase();

      list.innerHTML = "";

      notes.forEach((note, i) => {

        if (!note.text.toLowerCase().includes(search)) return;

        let div = document.createElement("div");
        div.className = "note";

        div.innerHTML = `
          ${note.text}
          <span class="tag ${note.category}">${note.category}</span>
          <div class="actions">
            <span class="edit" onclick="editNote(${i})">✏️ Edit</span>
            <span class="delete" onclick="deleteNote(${i})">❌ Delete</span>
          </div>
        `;

        list.appendChild(div);
      });
    }

    renderNotes();
  </script>

</body>
</html>
