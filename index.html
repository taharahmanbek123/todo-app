<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 14px;
      width: 360px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    input, select {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    button {
      padding: 8px 10px;
      margin: 3px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .add-btn {
      background: #4a6cf7;
      color: white;
    }

    ul {
      padding: 0;
      margin-top: 15px;
    }

    li {
      list-style: none;
      margin: 10px 0;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .done {
      text-decoration: line-through;
      color: gray;
    }

    .tag {
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 8px;
      color: white;
    }

    .work { background: #4a6cf7; }
    .study { background: green; }
    .personal { background: crimson; }

    .delete-btn {
      color: red;
      cursor: pointer;
      margin-left: 8px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>My Todo App</h1>

    <input type="text" id="taskInput" placeholder="Add task">

    <select id="category">
      <option value="work">Work</option>
      <option value="study">Study</option>
      <option value="personal">Personal</option>
    </select>

    <button class="add-btn" onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function renderTasks() {
      let list = document.getElementById("taskList");
      list.innerHTML = "";

      tasks.forEach((task, index) => {
        let li = document.createElement("li");

        let span = document.createElement("span");
        span.textContent = task.text;

        if (task.done) {
          span.classList.add("done");
        }

        span.onclick = function () {
          tasks[index].done = !tasks[index].done;
          saveTasks();
          renderTasks();
        };

        let tag = document.createElement("span");
        tag.textContent = task.category;
        tag.className = "tag " + task.category;

        let del = document.createElement("span");
        del.textContent = "❌";
        del.className = "delete-btn";

        del.onclick = function (e) {
          e.stopPropagation();
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        };

        li.appendChild(span);
        li.appendChild(tag);
        li.appendChild(del);

        list.appendChild(li);
      });
    }

    function addTask() {
      let input = document.getElementById("taskInput");
      let category = document.getElementById("category").value;

      if (input.value === "") return;

      tasks.push({
        text: input.value,
        done: false,
        category: category
      });

      input.value = "";
      saveTasks();
      renderTasks();
    }

    renderTasks();
  </script>

</body>
</html>
