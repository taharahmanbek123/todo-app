<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #74ebd5, #9face6);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 14px;
      width: 340px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
    }

    input {
      width: 65%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      outline: none;
    }

    button {
      padding: 10px 12px;
      margin-left: 5px;
      border: none;
      border-radius: 8px;
      background: #4a6cf7;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #3557d6;
      transform: scale(1.05);
    }

    ul {
      padding: 0;
      margin-top: 15px;
    }

    li {
      list-style: none;
      margin: 10px 0;
      padding: 10px;
      background: #f7f7f7;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;

      /* انیمیشن ورود */
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .done {
      text-decoration: line-through;
      color: gray;
    }

    .delete-btn {
      color: red;
      cursor: pointer;
      font-weight: bold;
      margin-left: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>My Todo App</h1>

    <input type="text" id="taskInput" placeholder="Add task">
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
  </div>

  <script>
    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function renderTasks() {
      let list = document.getElementById("taskList");
      list.innerHTML = "";

      tasks.forEach((task, index) => {
        let li = document.createElement("li");

        let span = document.createElement("span");
        span.textContent = task.text;

        if (task.done) {
          span.classList.add("done");
        }

        span.onclick = function () {
          tasks[index].done = !tasks[index].done;
          saveTasks();
          renderTasks();
        };

        let btn = document.createElement("span");
        btn.textContent = "❌";
        btn.className = "delete-btn";

        btn.onclick = function (e) {
          e.stopPropagation();
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        };

        li.appendChild(span);
        li.appendChild(btn);

        list.appendChild(li);
      });
    }

    function addTask() {
      let input = document.getElementById("taskInput");
      let task = input.value;

      if (task === "") return;

      tasks.push({ text: task, done: false });

      input.value = "";
      saveTasks();
      renderTasks();
    }

    renderTasks();
  </script>

</body>
</html>
